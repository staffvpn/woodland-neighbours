<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12160e">
<meta name="format-detection" content="telephone=no">
<title>Wood Neighbours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen game canvas; resource bar pinned top, five-tab dock pinned bottom, panels slide up as sheets */
:root{
  --bg:#12160e;
  --wood:#2b1d10;
  --wood-2:#3d2915;
  --panel:rgba(36,24,12,.92);
  --cream:#f5e6c6;
  --muted:#cdb68c;
  --honey:#efa94a;
  --honey-ink:#2a1a0c;
  --leaf:#8fb054;
  --berry:#d2533f;
  --line:rgba(245,230,198,.18);
  --display:"Alegreya SC",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cream);overflow:hidden;font-family:var(--body);overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--body);color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
[hidden]{display:none!important}

.top{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 10px) max(12px,var(--sr)) 0 max(12px,var(--sl));display:flex;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.me{position:relative;width:56px;height:56px;border-radius:50%;border:0;padding:0;background:conic-gradient(var(--honey) calc(var(--xp,0)*1%),rgba(0,0,0,.45) 0);flex:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.me canvas{position:absolute;inset:4px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#6c8a3c,#33461d)}
.lvl{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--honey);color:var(--honey-ink);font:700 13px/22px var(--body);text-align:center;box-shadow:0 0 0 2px var(--wood)}
.pills{flex:1;display:flex;justify-content:flex-end;gap:6px;min-width:0}
.pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 7px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.35);font:700 17px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.pill svg{width:25px;height:25px;flex:none}
.pill small{font:500 12px var(--body);color:var(--muted);margin-left:1px}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.12)}}

.tracker{position:absolute;left:max(12px,var(--sl));top:calc(var(--st) + 76px);max-width:min(260px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:left}
.tracker .ic{width:34px;height:34px;border-radius:10px;background:rgba(239,169,74,.18);display:grid;place-items:center;flex:none}
.tracker .ic svg{width:20px;height:20px;color:var(--honey)}
.tracker b{display:block;font:700 16px/1.15 var(--body)}
.tracker span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.tracker.done{border-color:var(--honey);animation:glowp 1.6s infinite}
@keyframes glowp{50%{box-shadow:0 0 0 3px rgba(239,169,74,.35),0 4px 14px rgba(0,0,0,.35)}}
.prog{height:5px;border-radius:3px;background:rgba(0,0,0,.4);margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--honey);border-radius:3px}

.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 10px);width:min(540px,calc(100% - 16px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:7px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.dock button{position:relative;border:0;background:transparent;border-radius:16px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 14px var(--body);color:var(--muted);min-width:0;white-space:nowrap}
.dock button svg{width:32px;height:32px;color:var(--cream)}
.dock button:active{background:rgba(255,255,255,.06)}
.dock button[aria-pressed="true"]{background:rgba(239,169,74,.16);color:var(--cream)}
.badge{position:absolute;top:4px;right:calc(50% - 26px);width:13px;height:13px;border-radius:50%;background:var(--berry);box-shadow:0 0 0 2px var(--wood)}

.buildbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);width:min(520px,calc(100% - 20px));display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.buildbar div{flex:1;min-width:0}
.buildbar b{display:block;font:700 18px var(--body)}
.buildbar span{display:block;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:13px 18px;font:700 16px var(--body);background:var(--honey);color:var(--honey-ink);white-space:nowrap}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--cream);border:1px solid var(--line)}
.btn.sm{padding:10px 14px;font-size:15px;border-radius:12px}
.btn:active{transform:scale(.97)}
.btn.no{background:rgba(255,255,255,.08);color:var(--muted)}

.scrim{position:absolute;inset:0;background:rgba(8,6,3,.45)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:min(78%,680px);display:flex;flex-direction:column;background:linear-gradient(180deg,#3a2714,#2a1c0e);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);padding-bottom:var(--sb);animation:up .26s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translate(-50%,100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(245,230,198,.25);margin:8px auto 2px}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
.sheet h2{margin:0;font:700 22px var(--display);letter-spacing:.02em}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.sbody{overflow:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sec{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.card.hi{border-color:rgba(239,169,74,.6);background:rgba(239,169,74,.08)}
.card img{width:48px;height:48px;object-fit:contain;flex:none}
.card .t{flex:1;min-width:0}
.card .t b{display:block;font:700 17px/1.2 var(--body)}
.card .t span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.cost{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cost em{font-style:normal;display:flex;align-items:center;gap:3px;font:700 13px var(--body);font-variant-numeric:tabular-nums}
.cost em img{width:18px;height:18px}
.cost em.lack{color:#ff9c84}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.slot img{width:62%;height:62%;object-fit:contain}
.slot b{position:absolute;right:6px;top:4px;font:700 14px var(--body);font-variant-numeric:tabular-nums}
.slot span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.rw{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.rw em{font-style:normal;display:flex;align-items:center;gap:3px;font:700 13px var(--body);color:var(--cream)}
.rw em img{width:18px;height:18px}

.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--st) + 140px);max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.4);font:500 14.5px var(--body);text-align:center;pointer-events:none;animation:tin .2s}
.toast.bad{border-color:rgba(255,140,110,.6)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-6px)}}

.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,3,.6);padding:24px}
.mcard{width:min(340px,100%);text-align:center;padding:24px 20px 20px;border-radius:24px;background:linear-gradient(180deg,#4a3118,#2c1d0e);border:1px solid rgba(239,169,74,.5);box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mcard .big{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffd27a,#d98a2b);color:var(--honey-ink);font:700 40px var(--display);box-shadow:0 0 30px rgba(255,190,90,.5)}
.mcard h3{margin:0;font:700 26px var(--display)}
.mcard p{margin:8px 0 14px;color:var(--muted);font-size:14.5px;line-height:1.45}
.mcard .rw{justify-content:center;margin-bottom:16px}

.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 40%,#3b2a14,#12160e 70%);z-index:50;transition:opacity .5s}
.splash h1{margin:0;font:700 40px/1 var(--display);letter-spacing:.02em;color:var(--cream);text-shadow:0 4px 24px rgba(239,169,74,.35)}
.splash p{margin:0;color:var(--muted);font-size:15px;letter-spacing:.06em}
.splash .bar{width:200px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.splash .bar i{display:block;height:100%;width:30%;background:var(--honey);border-radius:3px;transition:width .3s}
.splash.out{opacity:0;pointer-events:none}

.creator{position:absolute;inset:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:20px;align-items:center;padding:calc(var(--st) + 16px) max(18px,var(--sr)) calc(var(--sb) + 16px) max(18px,var(--sl));background:radial-gradient(ellipse at 35% 45%,rgba(40,24,10,.5),rgba(12,9,5,.94) 75%);overflow:auto;touch-action:pan-y}
.cr-stage{display:flex;flex-direction:column;align-items:center;gap:12px}
#crCanvas{width:min(100%,460px);aspect-ratio:5/6;height:auto}
.cr-panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cr-panel h2{margin:0;font:700 24px/1.1 var(--display)}
.cr-panel .lead{margin:4px 0 0;font-size:14px;color:var(--muted);line-height:1.4}
.nick{display:flex;align-items:center;gap:10px}
.nick label{font-size:14px;color:var(--muted)}
.nick input{flex:1;min-width:0;font:500 16px var(--body);color:var(--cream);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;user-select:text;-webkit-user-select:text}
.nick input:focus{border-color:var(--honey)}
.cr-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;touch-action:pan-x}
.cr-tabs::-webkit-scrollbar{display:none}
.cr-tabs button{flex:none;font:500 14px var(--body);color:var(--muted);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.cr-tabs button[aria-selected="true"]{color:var(--honey-ink);background:var(--honey);border-color:var(--honey)}
.cr-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cr-opts button{background:rgba(255,236,200,.06);border:1px solid var(--line);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font:500 14px var(--body);min-width:0}
.cr-opts canvas{width:100%;height:88px;display:block}
.cr-opts button[aria-pressed="true"]{border-color:var(--honey);background:rgba(239,169,74,.16);color:var(--cream)}
.cr-colors{display:flex;gap:18px;flex-wrap:wrap}
.cr-colors>div{display:flex;flex-direction:column;gap:6px}
.cr-colors span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sw{display:flex;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.35);padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--honey);outline-offset:2px}
.err{margin:0;font-size:13px;color:#ff9c84}
@media (max-width:760px){.creator{grid-template-columns:minmax(0,1fr);align-items:start}#crCanvas{width:200px;height:240px;aspect-ratio:auto}.cr-opts canvas{height:74px}}
@media (max-width:390px){.pill{padding:0 9px 0 6px;font-size:16px;height:38px;gap:4px}.pill svg{width:22px;height:22px}.pill small{display:none}.top{gap:6px}.dock button{font-size:13px}.dock button svg{width:30px;height:30px}}
</style>

</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Ваш лесной участок"></canvas>

  <div class="top">
    <button class="me" id="btnMe" aria-label="Уровень и житель"><canvas id="meFace" width="84" height="84"></canvas><span class="lvl" id="lvl">1</span></button>
    <div class="pills">
      <div class="pill" id="pEn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#3e7a3a"/><path d="M13.5 3.5 6.5 13h5l-1.5 7.5 7.5-10h-5z" fill="#ffe27a" stroke="#6a4a10" stroke-width="1" stroke-linejoin="round"/></svg><b id="enNum">40/40</b><small id="enT"></small></div>
      <div class="pill" id="pCoin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#e9a93a" stroke="#8a5a14" stroke-width="1.4"/><circle cx="12" cy="12" r="7" fill="none" stroke="#fbd77a" stroke-width="1.4"/><path d="M12 8v8M9.5 10h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4" fill="none" stroke="#8a5a14" stroke-width="1.6" stroke-linecap="round"/></svg><b id="coinNum">0</b></div>
      <div class="pill" id="pGem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12l4 5-10 12L2 9z" fill="#5fb6d6" stroke="#1d5266" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 9h20M8.5 4 12 21l3.5-17" fill="none" stroke="#c9f0ff" stroke-width="1" opacity=".8"/></svg><b id="gemNum">0</b></div>
    </div>
  </div>

  <button class="tracker" id="tracker" hidden><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span><span><b id="trT"></b><span id="trD"></span><span class="prog"><i id="trP"></i></span></span></button>

  <nav class="dock" id="dock" aria-label="Меню">
    <button data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Задания<i class="badge" id="bTasks" hidden></i></button>
    <button data-tab="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-5 9 5v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8 20v-7h8v7M8 16h8"/></svg>Амбар</button>
    <button data-tab="build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-3 3-6-6z"/><path d="M11 7 4 14a2 2 0 0 0 0 3l3 3a2 2 0 0 0 3 0l7-7"/></svg>Стройка</button>
    <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"/><path d="M5 13v7h14v-7M10 20v-4h4v4"/></svg>Лавка</button>
    <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Житель</button>
  </nav>

  <div class="buildbar" id="buildBar" hidden><div><b id="bbName"></b><span id="bbHint">Нажмите на свободное место</span></div><button class="btn ghost" id="bbCancel">Отмена</button><button class="btn" id="bbOk">Поставить</button></div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="shT"><div class="grab"></div><header><h2 id="shT"></h2><button class="x" id="shX" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="sbody" id="shB"></div></section>

  <div class="modal" id="modal" hidden><div class="mcard"><div class="big" id="mBig">2</div><h3 id="mT">Новый уровень</h3><p id="mP"></p><div class="rw" id="mR"></div><button class="btn" id="mOk" style="width:100%">Отлично</button></div></div>
  <div class="toast" id="toast" hidden></div>

  <div class="creator" id="creator" hidden>
    <div class="cr-stage"><canvas id="crCanvas" aria-label="Ваш житель"></canvas><button class="btn ghost sm" id="crRandom">Случайный облик</button></div>
    <div class="cr-panel">
      <div><h2>Новый житель леса</h2><p class="lead">Вам достался заросший участок в осеннем лесу. Соберите свой облик и обживайтесь.</p></div>
      <div class="nick"><label for="crNick">Имя</label><input id="crNick" maxlength="24" placeholder="@ваш_ник" autocomplete="off" spellcheck="false"></div>
      <div class="cr-tabs" id="crTabs" role="tablist" aria-label="Что настроить"></div>
      <div class="cr-opts" id="crOpts"></div>
      <div class="cr-colors"><div><span>Кожа</span><div class="sw" id="crSkin"></div></div><div><span>Цвет волос</span><div class="sw" id="crHairC"></div></div></div>
      <p class="err" id="crErr" hidden>Введите имя, чтобы начать</p>
      <button class="btn" id="crGo" style="padding:14px">На участок</button>
    </div>
  </div>

  <div class="splash" id="splash"><h1>Wood Neighbours</h1><p>лесное хозяйство</p><div class="bar"><i id="splashBar"></i></div></div>
</div>

<script>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ss = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function hash(x, y, z) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((z || 0) | 0, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vn(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
let seed = 7; const R = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
const pick = a => a[Math.floor(R() * a.length)];

}

// ---------- game rules ----------
function lvlFor(xp) { let l = 1; while (l < LV.length && xp >= LV[l]) l++; return l; }

  const n = Math.floor((now() - S.enT) / (EN_SEC * 1000));
  if (n > 0) { S.en = Math.min(EN_MAX, S.en + n); S.enT += n * EN_SEC * 1000; if (S.en >= EN_MAX) S.enT = now(); hud(); }
}

    setTimeout(() => showModal(S.lvl, 'Новый уровень', UNLOCK[S.lvl] ? 'Открыто: ' + UNLOCK[S.lvl] + '. Энергия восполнена.' : 'Энергия восполнена.', { coins: c, gems: 1 }), 500);

}
function reward(r, x, y) {

  if (r.gems) { S.gems += r.gems; floatAt(x, y, 'gems', '+' + r.gems, i++); bump('pGem'); }
  if (r.en) { S.en = Math.min(EN_MAX + 40, S.en + r.en); floatAt(x, y, 'en', '+' + r.en, i++); bump('pEn'); }

}

  const WHO = ['Лесник Ефим', 'Бабушка Марфа', 'Мельник Тихон', 'Пасечница Глаша', 'Кузнец Савва'];

// ---------- interaction ----------
function onTap(wx, wy) {
  if (mode === 'build') { ghost.x = wx; ghost.y = wy; snapGhost(); ghostHint(); haptic('light'); return; }
  const o = objAt(wx, wy);
  if (o) { interact(o); return; }
  goTo(wx, wy); avatar.target = null; tapMark = { x: avatar.tx, y: avatar.ty, t0: perf() };
}
function interact(o) {
  const K = KIND[o.k];
  avatar.target = o; tapMark = null;
  if (o.k === 'bed') {
    if (!o.crop) { openSheet('plant', o); return; }
    const left = CROPS[o.crop].dur - (now() - o.pt) / 1000;
    if (left > 0) { toast(CROPS[o.crop].n + ' созреет через ' + fmt(left)); walkTo(o, null); return; }
    if (S.en < 1) return noEnergy();
    walkTo(o, { type: 'harvest', o, dur: .8 }); return;
  }
  if (o.k === 'house' || o.k === 'fire') {
    const left = (o.cd || 0) - now();
    if (left > 0) { toast('Можно снова через ' + fmt(left / 1000)); walkTo(o, null); return; }
    walkTo(o, { type: 'rest', o, dur: 1.2 }); return;
  }
  if (!K.act) { walkTo(o, null); return; }
  if (o.k === 'berry' && o.rg && o.rg > now()) { toast('Ягоды поспеют через ' + fmt((o.rg - now()) / 1000)); walkTo(o, null); return; }
  if (S.en < K.en) return noEnergy();
  walkTo(o, { type: 'work', o, dur: K.dur });
}
function walkTo(o, job) { const p = approachPoint(o); goTo(p.x, p.y, job); avatar.face = o.x; }

function plant(o, c) {
  const C = CROPS[c];
  if (S.coins < C.cost) { haptic('error'); toast('Не хватает монет', true); return; }
  if (S.en < 1) return noEnergy();
  closeSheet(); avatar.target = o; walkTo(o, { type: 'plant', o, crop: c, dur: .7 });
}
function finishJob(j) {
  const o = j.o; if (!objs.includes(o)) return;
  const top = o.y - Math.min(60, dimsOf(o).h * .6);
  if (j.type === 'work') {
    const K = KIND[o.k]; if (S.en < K.en) return noEnergy();
    spendEn(K.en); floatAt(o.x, top, 'en', '-' + K.en, 0, true);
    const give = Object.assign({}, K.give, { xp: K.xp });
    if (o.k === 'weed' && R() < .3) give.coins = 2;
    if (o.k === 'tree' && R() < .25) give.mush = 1;
    reward(give, o.x, top - 18);
    burst(o.x, o.y - 14, K.fx, o.k === 'tree' ? 18 : 10);
    count(K.ev);
    if (o.k === 'berry') { o.rg = now() + K.regrow * 1000; }
    else if (K.then) { const n2 = makeObj(K.then, o.x, o.y); objs.splice(objs.indexOf(o), 1, n2); }
    else objs.splice(objs.indexOf(o), 1);
    haptic(o.k === 'tree' || o.k === 'rock' ? 'medium' : 'light');
  } else if (j.type === 'harvest') {
    const C = CROPS[o.crop]; spendEn(1); floatAt(o.x, top, 'en', '-1', 0, true);
    reward({ [o.crop]: C.yield, xp: C.xp }, o.x, top - 18); burst(o.x, o.y - 6, 'leaf', 10);
    o.crop = null; o.pt = 0; count('harvest'); haptic('medium');
  } else if (j.type === 'plant') {
    const C = CROPS[j.crop]; if (S.coins < C.cost || S.en < 1) return;
    S.coins -= C.cost; spendEn(1); o.crop = j.crop; o.pt = now();
    floatAt(o.x, top, 'coins', '-' + C.cost, 0, true); burst(o.x, o.y, 'dust', 8); count('plant'); haptic('light');
  } else if (j.type === 'rest') {
    const K = KIND[o.k]; o.cd = now() + K.cd * 1000; reward({ en: K.rest }, o.x, top); haptic('ok');
  }

}
